<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_NAME% — links</title>
    <meta name="description" content="%SITE_TAGLINE%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="%SITE_TAGLINE%" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#2f4a6b" />
    <style>
      :root { --seafoam:#9fd3c7; --navy:#2f4a6b; --red:#b5534a; --butter:#f4d98b; --sand:#e9dcc3; --cream:#faf6ec; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:#1f2a3a;
        background:linear-gradient(180deg,#cfe6f5 0%,#e9f3f7 55%,var(--sand) 100%); }
      main { width:100%; max-width:440px; background:rgba(255,253,247,.92); border-radius:24px; padding:34px 30px 28px; text-align:center;
        box-shadow:0 20px 60px rgba(47,74,107,.18); border:1px solid rgba(255,255,255,.8); }
      h1 { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:var(--navy); font-size:2.1rem; margin:10px 0 4px; }
      p.tag { margin:0 0 22px; color:#5a6a7a; }
      .links { display:grid; gap:10px; }
      .links a { display:flex; align-items:center; justify-content:space-between; text-decoration:none; font-weight:600; color:var(--navy);
        background:#fff; border:1.5px solid #d7e3ea; padding:14px 18px; border-radius:14px; transition:background .12s,border-color .12s,transform .12s; }
      .links a:hover { background:var(--seafoam); border-color:var(--seafoam); transform:translateY(-1px); }
      .links a span { color:#8a9aaa; font-weight:500; font-size:.85rem; }
      .links a:hover span { color:var(--navy); }
      .house { display:inline-block; margin-top:20px; background:var(--navy); color:#fff; text-decoration:none; font-weight:600; padding:13px 24px; border-radius:999px;
        box-shadow:0 6px 18px rgba(47,74,107,.3); }
      .house:hover { filter:brightness(1.1); }
      small { display:block; margin-top:10px; color:#7a8a9a; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 120 90" width="96" height="72" aria-hidden="true">
        <polygon points="10,45 60,8 110,45" fill="#4b4f54" /><rect x="20" y="45" width="80" height="40" fill="#9a9e9a" />
        <rect x="52" y="58" width="16" height="27" fill="#b5534a" /><rect x="28" y="52" width="14" height="14" fill="#2f4a6b" />
        <rect x="78" y="52" width="14" height="14" fill="#2f4a6b" /><rect x="80" y="14" width="8" height="22" fill="#9a6a5a" />
        <circle cx="20" cy="84" r="7" fill="#8fb6e8" /><circle cx="100" cy="84" r="7" fill="#c9b7ea" />
      </svg>
      <h1 id="name">%SITE_NAME%</h1>
      <p class="tag" id="tag">%SITE_TAGLINE%</p>
      <div class="links">
        <a id="l-resume" href="#" target="_blank" rel="noopener">Resume <span>PDF ↗</span></a>
        <a id="l-linkedin" href="#" target="_blank" rel="noopener">LinkedIn <span>↗</span></a>
        <a id="l-email" href="#">Email <span id="email-text"></span></a>
        <a id="l-instagram" href="#" target="_blank" rel="noopener">Instagram <span>↗</span></a>
      </div>
      <a class="house" href="./index.html">Walk through the Cape house →</a>
      <small>The full site is a 3D house you can explore. There's pong in the basement.</small>
    </main>
    <script type="module" src="./src/simple.js"></script>
  </body>
</html>
